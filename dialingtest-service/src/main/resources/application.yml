# 服务器配置
server:
  port: 8087
  servlet:
    context-path: /dialingtestapp
  # HTTPS配置
  ssl:
    enabled: true
    key-store: classpath:ssl/keystore.p12
    key-store-password: dialtest123
    key-store-type: PKCS12
    key-alias: dialtestcenter
    key-password: dialtest123
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers: TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# 跨域配置
spring:
  application:
    name: dial-test-center
    version: 1.0.0
  
  # 数据库配置 - PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/dialingtest
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    # 数据库连接池配置
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # 数据库初始化配置
  sql:
    init:
      mode: always
      continue-on-error: true
  
  # 开发工具
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  
  # 跨域配置
  web:
    cors:
      allowed-origins: "https://localhost:3000,https://localhost:5173,https://localhost:4396,http://localhost:3000,http://localhost:5173,http://localhost:4396"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB

  # Jackson配置
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# MyBatis配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
  type-aliases-package: com.huawei.cloududn.dialingtest.model

# WebSocket配置（V3版本：支持大容量二进制消息）
websocket:
  # 文本消息缓冲区大小（字节）
  text-buffer-size: 2097152
  # 二进制消息缓冲区大小（字节）- V3版本增大以支持大文件传输
  binary-buffer-size: 10485760
  # 最大空闲超时时间（毫秒）- 考虑心跳间隔30秒
  max-idle-timeout: 300000
  # 异步发送超时时间（毫秒）
  async-send-timeout: 180000
  # 最大会话数
  max-sessions: 1000

logging.config: classpath:config/log4j2-spring.xml